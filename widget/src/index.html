<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Stream Guestbook</title>
    <link href="styles/index.scss" rel="stylesheet" />
    <script type="module" src="scripts/index.ts"></script>
  </head>
  <body>
    <div id="widget">
      <script src="https://cdn.jsdelivr.net/npm/@tixyel/streamelements@7.14.1/dist/index.umd.js"></script>
      <div id="wrapper" class="wrapper">
        <ul id="book" class="book">
          <li class="book__list-item">
            <div class="book__page book__page--cover front">
              <div class="book__page-face book__page-face--front"></div>
              <div class="book__page-face book__page-face--back"></div>
            </div>
          </li>
          <li class="book__list-item">
            <div class="book__page book__page--cover back">
              <div class="book__page-face book__page-face--front"></div>
              <div class="book__page-face book__page-face--back"></div>
            </div>
          </li>
        </ul>
      </div>
      <template id="page-template">
        <ul>
          <li class="book__list-item">
            <div class="book__page">
              <div class="book__page-face book__page-face--front">
                <div class="book__stamps"></div>
              </div>
              <div class="book__page-face book__page-face--back">
                <div class="book__stamps"></div>
              </div>
            </div>
          </li>
        </ul>
      </template>
    </div>

    <div id="development-panel" class="development-panel">
      <div class="development-panel__header">Dev Panel</div>

      <div class="development-panel__section">
        <div class="development-panel__section-title">User</div>
        <input
          id="development-username"
          type="text"
          autocomplete="username"
          placeholder="Username"
          spellcheck="false"
          value="TestUser"
        />
      </div>

      <div class="development-panel__section">
        <div class="development-panel__section-title">Sign</div>
        <button id="development-sign-youtube">via YouTube command</button>
        <button id="development-sign-twitch">via Twitch command</button>
        <button id="development-sign-points">
          via Channel Points (Twitch)
        </button>
      </div>

      <div class="development-panel__section">
        <div class="development-panel__section-title">Commands</div>
        <button id="development-visits-self">!visits (self, YouTube)</button>
        <button id="development-visits-other">!visits @user (mod)</button>
        <button id="development-reset-other">!reset @user (mod)</button>
        <button id="development-top">!top (mod)</button>
      </div>

      <div class="development-panel__section">
        <div class="development-panel__section-title">Animations (UI only)</div>
        <button id="development-anim-sign">Sign animation</button>
        <button id="development-anim-visits">Visits animation</button>
      </div>

      <div class="development-panel__section">
        <div class="development-panel__section-title">Session</div>
        <button id="development-reset-session">
          Reset session (allow re-sign)
        </button>
        <button
          id="development-clear-all"
          class="development-panel__button--danger"
        >
          Clear ALL data
        </button>
      </div>

      <div class="development-panel__section">
        <div class="development-panel__section-title">Guests</div>
        <div
          id="development-panel-guests"
          class="development-panel__guests"
        ></div>
      </div>
    </div>
  </body>
</html>
